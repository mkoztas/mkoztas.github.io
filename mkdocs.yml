site_name: Mustafa Kerem Öztaş | Portfolyo
site_description: İklim Değişikliği, Hidro-Meteoroloji ve Su Kaynakları Analiz Portalı
site_author: Mustafa Kerem Öztaş
site_url: https://mkoztas.github.io/

theme:
  name: material
  language: tr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Karanlık Mod
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Aydınlık Mod
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.tabs.link       # Sekme geçişlerini tüm sayfada senkronize eder
    - content.code.copy       # Kod kopyalama butonu ekler
    - content.code.annotate

plugins:
  - search
    
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences      # Kod blokları için gerekli
  - pymdownx.tabbed:
      alternate_style: true   # Modern sekme görünümü sağlar
  - pymdownx.arithmatex:
      generic: true
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Ana Sayfa: index.md
  - Çalışmalar: calismalar.md
      - YL Tez Çalışması: kodlar/trend-analizi.md
      - Literatür Özeti: literatur.md
  - Veri Analizi ve Kodlar:
      - Trend ve Kırılma Analizi: kodlar/trend-analizi.md
      - Pre-Whitening (TFPW): kodlar/pre-whitening.md
      - Google Colab Analiz Alanı: kodlar/trend_analysis.ipynb
      - Mathworks Matlab Analiz Alanı: kodlar/trend_analysis_matlab.m
  - İndirilebilir Materyaller: indirmeler.md
